# Render Blueprint — optional convenience for one-click setup via "New +" -> "Blueprint"
# in the Render dashboard, pointed at this repo. If Render's blueprint schema has moved
# on since this was written, fall back to the manual setup steps in the root README's
# Deployment section — they don't depend on this file parsing correctly.
#
# Variables marked `sync: false` are secrets/deployment-specific values Render will
# prompt for during blueprint setup rather than deriving from this file — never put
# real values here.
services:
  - type: web
    name: ucomplain-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: UComplain
      - key: Jwt__Audience
        value: UComplain.AdminPortal
      - key: Jwt__AccessTokenMinutes
        value: "15"
      - key: Jwt__RefreshTokenDays
        value: "7"
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: WhatsApp__AppSecret
        sync: false
      - key: WhatsApp__VerifyToken
        sync: false
      - key: WhatsApp__AccessToken
        sync: false
      - key: WhatsApp__PhoneNumberId
        sync: false
      - key: WhatsApp__ApiVersion
        value: v21.0
      - key: WhatsApp__NumberHashKey
        sync: false
